
<script>
    (function dynamicRedirect() {
        const home = "https://aseriy.github.io/cockroachbase/";
        const base = new URL(home).pathname;
        const prefixes = [
            "/guides/",
            "/reference/",
            "/learn/"
        ];

        const currentPath = window.location.pathname.slice(base.length - 1);

        for (const prefix of prefixes) {
            if (currentPath.startsWith(prefix)) {
                window.location.replace(home);
                break;
            }
        }
    })();
</script>
