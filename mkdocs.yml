site_name: CockroachBase
site_url: https://aseriy.github.io/cockroachbase/
theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
  font: false
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/landing.js
markdown_extensions:
  - pymdownx.quotes:
      callouts: true
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
exclude_docs: |
  /includes/
hooks:
  - hooks/landing.py
plugins: []
extra:
  generator: false
copyright: "© 2026 CockroachBase"
